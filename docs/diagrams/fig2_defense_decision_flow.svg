  <text x="475.0" y="337.3" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">• fail → quarantine</text>
  <text x="475.0" y="352.4" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">• missing → review</text>
  <text x="475.0" y="367.6" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">（跳过 LLM 节省算力）</text>
