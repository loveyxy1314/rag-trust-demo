  <text x="648.0" y="710.0" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6B4E00">≥0.70 / ≥0.40 / &lt;0.40</text>
  <rect x="830" y="666" width="396" height="66" rx="8" ry="8" fill="#FDECEC" stroke="#E15759" stroke-width="1.6"/>
  <text x="1028.0" y="695.3" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7F1D1D">quarantine (≥0.70) 或 review (0.40–0.70)</text>
  <text x="1028.0" y="710.4" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">排除出生成上下文，写入审计日志（记入 FPR / 误伤统计）</text>
  <rect x="64" y="666" width="396" height="66" rx="8" ry="8" fill="#EDF6EC" stroke="#59A14F" stroke-width="1.8"/>
  <text x="262.0" y="695.3" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#24541E">allow (&lt;0.40)：进入受控生成上下文</text>
  <text x="262.0" y="710.4" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#24541E">按 [doc_id] text 拼接（≤3600 字符）；若全空→程序拒答“证据不足”</text>
