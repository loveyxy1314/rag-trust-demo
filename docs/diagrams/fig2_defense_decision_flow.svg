  <text x="1049.0" y="370.8" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">输出 {&quot;label&quot;: attack | unclear | quoted | none}</text>
  <text x="1049.0" y="385.7" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">分值：0.90 / 0.55 / 0.25 / 0.02（失败重试 1 次）</text>
  <rect x="896" y="434" width="306" height="82" rx="8" ry="8" fill="#FEF3E6" stroke="#F28E2B" stroke-width="2.0"/>
  <text x="1049.0" y="463.9" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#7A4100">分支 2：事实一致性短调用（≤32 tokens）</text>
  <text x="1049.0" y="478.8" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">输出 {&quot;label&quot;: contradicted | insufficient | supported}</text>
  <text x="1049.0" y="493.7" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">分值：0.85 / 0.50 / 0.05（仅读 text + trusted_ref）</text>
  <rect x="672" y="540" width="530" height="66" rx="8" ry="8" fill="#EAF5F4" stroke="#76B7B2" stroke-width="1.6"/>
  <text x="937.0" y="569.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#1F4E4A">冻结风险聚合：risk_score = max(score_injection, score_fact)</text>
  <text x="937.0" y="584.6" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#1F4E4A">解析修复后仍失败则回退 review；结果写入 detector_cache.jsonl</text>
