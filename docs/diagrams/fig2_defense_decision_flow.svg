  <text x="475.0" y="563.3" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">• distro_wiki（已验证未列）</text>
  <text x="475.0" y="578.4" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">• forum / blog / archive</text>
