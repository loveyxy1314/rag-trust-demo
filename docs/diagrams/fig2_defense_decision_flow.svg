  <text x="759.0" y="383.4" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6B4E00">(prompt+text+ref)</text>
