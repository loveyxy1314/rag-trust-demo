  <text x="60.0" y="177.3" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">• 替换同 doc_id 正常文档（5%/10%/20%）</text>
  <text x="60.0" y="192.4" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">• 可伪造声明式 source（如 man_pages）</text>
  <text x="60.0" y="207.6" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">• 不可篡改已落盘基线清单与评价真值</text>
  <rect x="48" y="266" width="306" height="110" rx="8" ry="8" fill="#FEF3E6" stroke="#F28E2B" stroke-width="1.8"/>
  <text x="60.0" y="302.1" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7A4100">载荷类型 1：提示注入（100 条）</text>
  <text x="60.0" y="317.3" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">• I1 定向改写答案指令</text>
  <text x="60.0" y="332.4" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">• I2 诱导输出哨兵 RAG_POISON_999</text>
  <text x="60.0" y="347.6" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">伪装为技术备注或系统提示</text>
  <rect x="48" y="404" width="306" height="110" rx="8" ry="8" fill="#FEF3E6" stroke="#F28E2B" stroke-width="1.8"/>
  <text x="60.0" y="440.1" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7A4100">载荷类型 2：错误技术事实（100 条）</text>
  <text x="60.0" y="455.3" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">• F1 / F2 颠倒 Linux 系统调用语义</text>
  <text x="60.0" y="470.4" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">（如 fork 返回值、SIGKILL 可捕获等）</text>
  <text x="60.0" y="485.6" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">无显式攻击指令，规则词难以拦截</text>
