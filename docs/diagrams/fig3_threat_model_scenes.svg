  <text x="715.0" y="461.9" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6B4E00">基线已包含投毒文本</text>
