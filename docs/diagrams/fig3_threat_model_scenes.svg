  <text x="640.0" y="56" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A626A">受控对照实验设计：区分字节级篡改（post）与供应链入库前污染（pre）对三层防护的不同可观测性</text>
