  <text x="1138.0" y="450.3" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#24541E">ASR(被攻击) 65% → 0%</text>
  <text x="1138.0" y="465.4" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#24541E">代价：14 条正常</text>
  <text x="1138.0" y="480.6" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#24541E">distro_wiki 被转复核</text>
  <rect x="426" y="522" width="804" height="62" rx="8" ry="8" fill="#FFF7F7" stroke="#CC3311" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="828.0" y="556.9" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A61C00">关键结论（pre_ingestion）：SHA-256 无法发现入库前投毒（integrity 组与 baseline 完全一致，ASR 65%）；必须依赖来源与内容级语义检测互补。</text>
