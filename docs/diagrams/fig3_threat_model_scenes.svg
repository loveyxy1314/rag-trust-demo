  <text x="925.0" y="472.4" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7A4100">语义拦截 24/55 伪造源</text>
