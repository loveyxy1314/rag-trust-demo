  <text x="1138.0" y="172.3" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#24541E">100% 检出篡改</text>
  <text x="1138.0" y="187.4" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#24541E">16/16 · 28/28 · 55/55</text>
  <text x="1138.0" y="202.6" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#24541E">ASR = 0（无需语义层）</text>
  <rect x="426" y="244" width="804" height="62" rx="8" ry="8" fill="#EAF5F4" stroke="#76B7B2" stroke-width="1.2"/>
  <text x="828.0" y="278.9" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F4E4A">关键结论（post_ingestion）：哈希校验对“入库后字节级篡改”零漏报、低开销；20% 投毒下 integrity 组正确率 83.3%（vs baseline 37.5%）。</text>
