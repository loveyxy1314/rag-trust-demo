  <text x="510.0" y="456.9" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7F1D1D">同 doc_id 替换</text>
